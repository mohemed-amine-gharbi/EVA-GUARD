# Exemple de scrape pour le nœud surveillé (adapter l'adresse du conteneur Geth).
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: geth
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: ["geth-victim:6060"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
